<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="shortcut icon" href="https://behealth.com.ua/assets/img/favicon.ico" type="img/png">
  <meta charset="UTF-8">
  <title>Календар задач | Академія</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/1.1.0/modern-normalize.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/main.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<style>
  main {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin-top: -32px;
    margin-bottom: 72px; 
    min-height: calc(100vh - 150px);
    opacity: 1;
    transform: translateY(40px);
    transition: all 2s ease-out;
  }
  
  main.loaded {
    animation: breathe 2s ease-out;
  }

  @keyframes breathe {
    0% { transform: scale(0.9) translateY(40px); opacity: 0; }
    50% { transform: scale(1.05) translateY(-10px); opacity: 0.8; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  .calendar-container {
    max-width: 1200px;
    margin: 0 auto 60px auto; 
    position: relative;
    overflow: hidden;
    padding: 10px;
  }

  #calendarBackground {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0.9;
    z-index: 0;
    transition: opacity 1s ease-in-out, background-image 1s ease-in-out;
  }

  #calendarBackground.loaded {
    opacity: 0.9;
  }

  #calendar {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
  }

  .calendar-header {
    text-align: center;
    margin-bottom: 10px;
    position: relative;
    z-index: 2;
  }

  .weekday {
    text-align: center;
    font-weight: bold;
    padding: 5px;
    background: #e5fdd1;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  .day {
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 5px;
    min-height: 120px;
    cursor: pointer;
    transition: all 0.3s ease;
    opacity: 0.9;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }

  .day:hover {
    box-shadow: 0 0 5px 5px #ffc0cbce;
  }

  .day strong {
    display: block;
    margin-bottom: 5px;
  }

  .day.weekend {
    background-color: #ffe5e5;
  }

  .day.has-tasks {
    background-color: #fffafb;
    border: 2px solid #f44336;
    box-shadow: 0 0 8px rgba(244, 67, 54, 0.3);
  }

  .day.all-done {
    background-color: #f0fff4;
    border: 2px solid #4caf50;
  }

  .planned-task-label {
    font-size: 11px;
    color: #d32f2f;
    font-weight: 700;
    text-align: center;
    background: #ffebee;
    padding: 4px 2px;
    border-radius: 4px;
    margin-top: auto;
    margin-bottom: auto;
    width: 100%;
    box-sizing: border-box;
  }

  .task {
    font-size: 13px;
    margin: 6px 0;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 8px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    box-sizing: border-box;
  }

  .task-text {
    flex-grow: 1;
    margin-right: 8px;
    white-space: normal; 
    word-wrap: break-word;
    line-height: 1.4;
  }

  .task-text.done {
    text-decoration: line-through;
    color: gray;
  }

  button {
    background: #25a72b;
    color: white;
    border: 1px solid #ccc;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 5px;
  }

  button:hover { background: #218a24; }
  button:active { outline: none; box-shadow: 0 0 0 3px #25a72b; }

  .modal {
    position: fixed; 
    top: 50%;
    left: 50%;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000; 
  }

  .modal-content {
    background: white;
    padding: 25px;
    border-radius: 8px;
    width: 440px;
    max-width: 90%;
    max-height: 85vh; 
    overflow-y: auto; 
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  .modal-content h3 { margin-top: 0; color: #333; }

  input[type="text"] {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    font-size: 14px;
    border-radius: 5px;
    border: 1px solid #ddd;
    box-sizing: border-box;
  }

  .filter { margin-top: 10px; margin-bottom: 15px; }
  
  .today-highlight {
    border: 2px solid #25a72b;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(6px);
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 5px rgba(15, 190, 30, 0.603); }
    70% { box-shadow: 0 0 0 10px rgba(15, 190, 30, 0); }
    100% { box-shadow: 0 0 0 3px rgba(15, 190, 30, 0); }
  }

  .role-badge {
    font-size: 12px;
    background: #e5fdd1;
    padding: 4px 10px;
    border-radius: 4px;
    color: #218a24;
    font-weight: 600;
    margin-left: 10px;
    display: inline-block;
  }
</style>

  <script src='./weather.js'></script>
</head>
<body>
  <div id="header-container"></div> 
  
  <main class="loaded">
    <div class="calendar-container">
      <div id="calendarBackground">
        <img id="bgPreloader" style="display: none;" />
      </div>

      <div class="calendar-header">
        <button onclick="changeMonth(-1)">←</button>
        <span id="monthLabel" style="font-weight: bold; font-size: 18px; color: #25a72b; margin: 0 15px;"></span>
        <button onclick="changeMonth(1)">→</button>
        
        <span id="userRoleBadge" class="role-badge">Завантаження профілю...</span>

        <button class="btn" type="button" style="margin-left: 20px;">
          <a class="text__work" href="./cabinet.html" style="text-decoration: none; font-size: smaller; color: white;">
            Мій кабінет
          </a>
        </button>
      </div>

      <div id="calendar"></div>
    </div>
  </main>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>Задачі на <span id="modalDate" style="color: #25a72b;"></span></h3>
      <div class="filter">
        <label style="font-size: 13px; cursor: pointer;">
          <input type="checkbox" id="hideDone" onchange="renderTaskList()"> Показати лише невиконані
        </label>
      </div>
      <div id="taskList" style="max-height: 300px; overflow-y: auto; padding-right: 5px;"></div>
      <input type="text" id="taskInput" placeholder="Нова задача або візит...">
      <div style="margin-top: 15px; display: flex; justify-content: space-between;">
        <button onclick="addTask()">Додати</button>
        <button onclick="closeModal()" style="background: #757575;">Закрити</button>
      </div>
    </div>
  </div>
  
  <script src="theme-toggle.js"></script>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby87iUOv2tul_QrIBiuJ8JgcfCOl4WQ3igIuIDNWpZS4CN2y27RRtD752dyePFZRvGf8A/exec";

    const trainingNamesMap = {
      "trening1.html": "Visit structure (Базовий тренінг МП)",
      "trening2.html": "Decision-maker (Тренінг по роботі з ЛПР)",
      "trening3.html": "Presentation (Тренінг з презентації продукту)",
      "trening4.html": "Business emailing (Тренінг з ділового листування)",
      "trening5.html": "Handling objections (Робота з запереченнями)",
      "trening6.html": "Dealing with competitor (Робота з конкурентами)",
      "trening7.html": "Reviews writing (Тренінг з написання відгуків)",
      "trening8.html": "Sales management (Тренінг з управління продажами)",
      "trening9.html": "Targeting (Створення партнерської бази)",
      "trening10.html": "Situational leadership (Ситуаційне лідерство)",
      "trening11.html": "People development (Розвиток персоналу)",
      "trening12.html": "Negotiation process (Тренінг з ведення переговорів)",
      "trening13.html": "Presentation making (Тренінг з підготовки презентацій)",
      "trening14.html": "Time management (Тренінг з тайм-менеджменту)",
      "trening15.html": "Quality control (Тренінг з контролю якості)",
      "trening16.html": "Call sales (Тренінг з дистанційного продажу)",
      "trening17.html": "Discounts offering (Тренінг по роботі зі знижками)",
      "trening18.html": "Conference activities (Тренінг по роботі на конференціях)",
      "trening19.html": "Needs (Тренінг з визначення потреб)",
      "Trening20.html": "Пропозиції (до бізнес тренера)",
      "trening21.html": "Pharmacovigilance (Тренінг з фармаконагляду)",
      "trening22.html": "Effective communication (Тренінг з ефективної комунікації)",
      "trening23.html": "Pharm-unit work (Тренінг з роботи в аптечному юніті)"
    };

    const currentUser = (localStorage.getItem("allowedEmail") || "mp11").toLowerCase();
    const userRole = (localStorage.getItem("userRole") || "mp").toLowerCase();
    const userFullName = localStorage.getItem("userFullName") || currentUser;

    let hierarchyUsers = [];
    let userNamesMap = {};

    // Запасна локальна мапа підпорядкованості
    const managerToEmployees = {
      'rm1': ['mp11', 'mp12', 'mp13'],
      'rm2': ['mp21', 'mp22', 'mp23'],
      'rm3': ['mp31', 'mp32', 'mp33'],
      'admin': ['mp11', 'mp12', 'mp13', 'mp21', 'mp22', 'mp23', 'mp31', 'mp32', 'mp33', 'rm1', 'rm2', 'rm3']
    };

    // Динамічне завантаження ієрархії з Деканату
    async function loadHierarchy() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getUsersHierarchy`);
        const json = await res.json();
        if (json.status === "success" && json.users) {
          hierarchyUsers = json.users;
          hierarchyUsers.forEach(u => {
            if (u.login) {
              userNamesMap[u.login.toLowerCase()] = u.fullName || u.login;
            }
          });
        }
      } catch (err) {
        console.warn("Не вдалося завантажити ієрархію з сервера, використовуємо локальну мапу:", err);
      }
    }

    // Рекурсивний пошук підлеглих у дереві
    function getSubordinates(managerEmail, allUsers) {
      let subs = [];
      const mEmail = (managerEmail || "").toLowerCase();
      
      allUsers.forEach(u => {
        const uMgr = (u.manager || "").toLowerCase();
        const uLogin = (u.login || "").toLowerCase();
        
        if (uMgr === mEmail && uLogin !== mEmail) {
          subs.push(uLogin);
          const nested = getSubordinates(uLogin, allUsers);
          subs = subs.concat(nested);
        }
      });
      
      return Array.from(new Set(subs));
    }

    function getSubordinatesFallback(managerEmail) {
      let subs = [];
      const m = managerEmail.toLowerCase();
      if (managerToEmployees[m]) {
        managerToEmployees[m].forEach(emp => {
          subs.push(emp.toLowerCase());
          subs = subs.concat(getSubordinatesFallback(emp));
        });
      }
      return Array.from(new Set(subs));
    }

    // Визначення списку доступних пошт для перегляду
    function getAllowedViewers() {
      const allowed = new Set([currentUser.toLowerCase()]);
      
      if (userRole === "admin" || currentUser === "admin") {
        if (hierarchyUsers.length > 0) {
          hierarchyUsers.forEach(u => { if (u.login) allowed.add(u.login.toLowerCase()); });
        } else {
          Object.keys(managerToEmployees).forEach(m => allowed.add(m.toLowerCase()));
          Object.values(managerToEmployees).flat().forEach(e => allowed.add(e.toLowerCase()));
        }
      } else {
        if (hierarchyUsers.length > 0) {
          const subs = getSubordinates(currentUser, hierarchyUsers);
          subs.forEach(s => allowed.add(s.toLowerCase()));
        } else {
          const subs = getSubordinatesFallback(currentUser);
          subs.forEach(s => allowed.add(s.toLowerCase()));
        }
      }
      
      return Array.from(allowed);
    }

    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let tasks = {}; 
    let activeDayStr = null;

    const monthNames = [
      "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
      "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"
    ];
    const weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
    
    const backgroundKeywords = ["nature", "forest", "sunrise", "flowers", "mountains", "sky", "beach", "fog", "leaves", "snow"];
    const fallbackImages = [
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=80",
      "https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1600&q=80",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80",
      "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?auto=format&fit=crop&w=1600&q=80",
      "https://images.unsplash.com/photo-1449844908441-8829872d2607?auto=format&fit=crop&w=1600&q=80"
    ];
    let carouselIndex = 0;
    let carouselInterval;

    function updateBackgroundManually() {
      const bg = document.getElementById('calendarBackground');
      if (!bg) return;
      const keyword = backgroundKeywords[carouselIndex % backgroundKeywords.length];
      const uniqueSig = `${Date.now()}-${carouselIndex}`;
      const requestUrl = `https://source.unsplash.com/1600x900/?${keyword}&sig=${uniqueSig}`;
      const fallbackUrl = fallbackImages[carouselIndex % fallbackImages.length];

      const img = new Image();
      img.onload = () => { bg.style.backgroundImage = `url('${requestUrl}')`; bg.classList.add('loaded'); };
      img.onerror = () => { bg.style.backgroundImage = `url('${fallbackUrl}')`; bg.classList.add('loaded'); };
      img.src = requestUrl;
      carouselIndex++;
    }

    function startBackgroundCarousel() {
      updateBackgroundManually();
      carouselInterval = setInterval(updateBackgroundManually, 10000);
    }

    async function loadTasksFromServer() {
      let loadedFromServer = false;
      try {
        const response = await fetch(`${SCRIPT_URL}?action=getTasks&year=${currentYear}&month=${currentMonth}&email=${encodeURIComponent(currentUser)}`);
        const result = await response.json();
        if (result.status === "success") {
          tasks = result.tasks || {};
          loadedFromServer = true;
        }
      } catch (e) {
        console.warn("Використовуємо локальне сховище для задач.");
      } finally {
        if (!loadedFromServer) {
          const key = `tasks-${currentYear}-${currentMonth}`;
          tasks = JSON.parse(localStorage.getItem(key)) || {};
        }
        generateCalendar(currentYear, currentMonth);
      }
    }

    async function saveTasksToServer() {
      const key = `tasks-${currentYear}-${currentMonth}`;
      localStorage.setItem(key, JSON.stringify(tasks));
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "saveTasks", year: currentYear, month: currentMonth, tasks: tasks })
        });
      } catch (e) {
        console.error("Помилка збереження на сервер:", e);
      }
    }

    function getFilteredTasksForDay(dayStr) {
      if (!tasks[dayStr]) return [];
      const allowed = getAllowedViewers();
      return tasks[dayStr].filter(t => {
        const author = (t.author || "").toLowerCase();
        const targetEmail = (t.userEmail || t.email || author).toLowerCase();
        return allowed.includes(targetEmail) || allowed.includes(author);
      });
    }

    function generateCalendar(year, month) {
      document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;
      
      const badge = document.getElementById('userRoleBadge');
      if(badge) {
        badge.textContent = `Роль: ${userRole.toUpperCase()} | ${userFullName}`;
      }

      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      weekdays.forEach(day => {
        const header = document.createElement('div');
        header.className = 'weekday';
        header.textContent = day;
        calendar.appendChild(header);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const offset = (firstDay + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < offset; i++) {
        calendar.appendChild(document.createElement('div'));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const dayOfWeek = date.getDay();
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        dayDiv.onclick = () => openModal(d, dayStr);

        const isToday = d === new Date().getDate() && month === new Date().getMonth() && year === new Date().getFullYear();
        if (isToday) dayDiv.classList.add('today-highlight');
        if (dayOfWeek === 0 || dayOfWeek === 6) dayDiv.classList.add('weekend');

        let innerHTML = `<strong>${d}</strong>`;
        const dayTasks = getFilteredTasksForDay(dayStr);

        if (dayTasks.length > 0) {
          const allDone = dayTasks.every(t => t.done);
          if (allDone) {
            dayDiv.classList.add('all-done');
            innerHTML += `<div class="planned-task-label" style="color: #2e7d32; background: #e8f5e9;">Всі завдання виконано (${dayTasks.length})</div>`;
          } else {
            dayDiv.classList.add('has-tasks');
            innerHTML += `<div class="planned-task-label">Завдань: ${dayTasks.length}</div>`;
          }
        }

        dayDiv.innerHTML = innerHTML;
        calendar.appendChild(dayDiv);
      }
    }

    function openModal(day, dayStr) {
      activeDayStr = dayStr;
      document.getElementById('modalDate').textContent = `${day} ${monthNames[currentMonth]} ${currentYear}`;
      document.getElementById('taskInput').value = '';
      document.getElementById('hideDone').checked = false;
      renderTaskList();
      document.getElementById('modal').style.display = 'flex';
      clearInterval(carouselInterval);
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      startBackgroundCarousel();
    }

    function renderTaskList() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      const hideDone = document.getElementById('hideDone').checked;
      const dayTasks = getFilteredTasksForDay(activeDayStr);

      if (dayTasks.length === 0) {
        container.innerHTML = `<p style="color: #757575; font-size: 13px;">Немає запланованих завдань.</p>`;
        return;
      }

      dayTasks.forEach((taskObj, index) => {
        if (hideDone && taskObj.done) return;

        const taskEl = document.createElement('div');
        taskEl.className = 'task';
        const taskClass = taskObj.done ? 'task-text done' : 'task-text';

        let cleanText = taskObj.text || "";
        let actionButtonHtml = "";

        let targetUserEmail = (taskObj.userEmail || taskObj.email || taskObj.author || "").toLowerCase();
        let displayName = userNamesMap[targetUserEmail] || targetUserEmail;
        let userBadge = `<span style="font-size: 11px; font-weight: bold; color: #25a72b; background: #e8f5e9; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 4px;">👤 Для: ${displayName}</span>`;

        if (cleanText.includes("посилання:")) {
          const parts = cleanText.split("| посилання:");
          cleanText = parts[0].trim();
          let linksPart = parts[1] ? parts[1].trim() : "";

          if (linksPart.includes(",")) {
            let linksArray = linksPart.split(",");
            actionButtonHtml = `<div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;">`;
            linksArray.forEach(l => {
              let cl = l.trim();
              let name = trainingNamesMap[cl] || cl;
              actionButtonHtml += `<a href="./${cl}" target="_blank" style="background: #2196F3; color: white; padding: 3px 8px; border-radius: 3px; font-size: 11px; text-decoration: none; display: inline-block; margin-bottom: 2px;">📖 ${name}</a>`;
            });
            actionButtonHtml += `</div>`;
          } else if (linksPart) {
            let name = trainingNamesMap[linksPart] || linksPart;
            actionButtonHtml = `<div style="margin-top: 6px;"><a href="./${linksPart}" target="_blank" style="background: #2196F3; color: white; padding: 3px 8px; border-radius: 3px; font-size: 11px; text-decoration: none; display: inline-block;">📖 ${name}</a></div>`;
          }
        }

        taskEl.innerHTML = `
          <div class="${taskClass}">${userBadge}<br>${cleanText}${actionButtonHtml}</div>
          <div style="display: flex; flex-direction: column; gap: 4px; margin-left: 8px;">
            <button onclick="markDone('${activeDayStr}', ${index})" style="padding: 4px; font-size: 11px;">✅</button>
            <button onclick="cancelTask('${activeDayStr}', ${index})" style="padding: 4px; font-size: 11px; background: #f44336;">❌</button>
          </div>
        `;
        container.appendChild(taskEl);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      if (!tasks[activeDayStr]) tasks[activeDayStr] = [];
      tasks[activeDayStr].push({ text: text, author: currentUser, userEmail: currentUser, done: false });
      
      input.value = '';
      saveTasksToServer();
      renderTaskList();
      generateCalendar(currentYear, currentMonth);
    }

    function markDone(dayStr, index) {
      if (tasks[dayStr] && tasks[dayStr][index]) {
        tasks[dayStr][index].done = !tasks[dayStr][index].done;
        saveTasksToServer();
        renderTaskList();
        generateCalendar(currentYear, currentMonth);
      }
    }

    function cancelTask(dayStr, index) {
      if (tasks[dayStr]) {
        tasks[dayStr].splice(index, 1);
        if (tasks[dayStr].length === 0) delete tasks[dayStr];
        saveTasksToServer();
        renderTaskList();
        generateCalendar(currentYear, currentMonth);
      }
    }

    function changeMonth(offset) {
      currentMonth += offset;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      loadTasksFromServer();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadHierarchy();
      await loadTasksFromServer();
      startBackgroundCarousel();
    });
  </script>

  <script src="headfoot.js"></script>
  <script src="scroll.js"></script>
  <script src="scrbtn.js"></script>

</body>
</html>
