<script>
  function sha256(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    return crypto.subtle.digest("SHA-256", data).then(hash => {
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
  }

<body>
  <div id="header-container"></div>
  <main>
    <section class="works">
      <div class="container">
  <h1 style="text-align: center;">🎯 Генератор Альтернатив Знижці</h1>

  <label for="institution">Тип установи:</label>
  <select id="institution">
    <option value="державна">Державна лабораторія</option>
    <option value="приватна">Приватна лабораторія</option>
  </select>

  <label for="disc">DISC-профіль партнера:</label>
  <select id="disc">
    <option value="D">D — Рішучий</option>
    <option value="I">I — Впливовий</option>
    <option value="S">S — Стабільний</option>
    <option value="C">C — Аналітичний</option>
  </select>

  <label for="situation">Ситуація:</label>
  <select id="situation">
    <option value="старт">Старт</option>
    <option value="тендер">Тендер</option>
    <option value="масштабування">Масштабування</option>
  </select>

  <label for="need">Основна потреба партнера:</label>
  <select id="need">
    <option value="бюджет">Бюджет</option>
    <option value="швидкість">Швидкість</option>
    <option value="сервіс">Сервіс</option>
    <option value="надійність">Надійність</option>
  </select>

  <button style="margin-top: 20px;" class="btn" onclick="generate()">🔄 Згенерувати фразу</button>
  <button class="btn" onclick="window.location.href='./trening17.html'">Назад</button>
  <div id="result"></div>

  <!-- Кнопки після блоку результату -->
<div id="actions" style="margin-top: 10px; position: relative; display: flex; justify-content: center; gap: 10px;">
  <button class="btn" onclick="copyText()">Копіювати</button>
  <button  class="btn" onclick="sendViber()">Viber</button>
  <button class="btn" onclick="sendTelegram()">Telegram</button>
  <button class="btn" onclick="sendWhatsApp()">WhatsApp</button>
</div>
      </div>
</section>
  </main>
  <div id="footer-container"></div>
  <script>
    const data = {
      institution: {
        державна: ["Враховуючи специфіку державної лабораторії, ми адаптували рішення без потреби формальної знижки.",
                   "Модель співпраці враховує ваші бюджетні обмеження — без прямого дисконту."],
        приватна: ["Приватна лабораторія — це про гнучкість. Тому ми пропонуємо цінність у сервісі, а не в цифрах.",
                   "Замість знижки — пріоритетний сервіс та мінімізація логістичних витрат."]
      },
      disc: {
        D: ["Розуміємо, вам важливо діяти швидко — тому наш підхід без зайвих погоджень.",
            "Без зайвих етапів: замість знижки — старт без затримок та чіткий KPI."],
        I: ["Ваша роль в рішенні критична — ми створюємо умови, де ви можете проявити вплив.",
            "Разом з вами створюємо win-win. Замість знижки — можливість показати результат."],
        S: ["Ми будуємо довіру — тому пропонуємо стабільність без ілюзії знижок.",
            "Фіксовані умови — це наша альтернатива знижці для довгострокових відносин."],
        C: ["Детальна структура пропозиції замість знижки — ми відкрито обґрунтовуємо кожну цифру.",
            "Альтернатива знижці — оптимізована модель з об'єктивними даними."]
      },
      situation: {
        старт: ["На старті важлива простота — ми беремо на себе логістичні турботи.",
                "Щоб старт був легким, ми надаємо супровід, замість формального дисконту."],
        тендер: ["У тендері важлива прозорість — ми пропонуємо повну модель вартості без прихованих знижок.",
                 "Замість дисконтів — адаптована комерційна пропозиція з чіткими умовами."],
        масштабування: ["Масштабування — це про ефективність. Ми оптимізуємо обсяг без знижок.",
                        "При зростанні — пропонуємо пакетне рішення, яке фактично є знижкою."]
      },
      need: {
        бюджет: ["Модель економить бюджет, не втрачаючи якість.",
                 "Ми пропонуємо таку ціну, яка вже враховує знижку — без її назви."],
        швидкість: ["Швидке реагування — наша альтернатива будь-яким дисконтам.",
                    "У швидкості — наша перевага. Ми стартуємо без пауз."],
        сервіс: ["Преміум-сервіс замість знижки — ви отримуєте більше, ніж очікуєте.",
                 "Рівень сервісу компенсує формальну відсутність дисконту."],
        надійність: ["Надійність у постачанні — це головне, і ми гарантуємо це замість знижки.",
                     "Фіксовані поставки та гарантії — це наша альтернатива знижці."]
      }
    };

    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generate() {
      const inst = document.getElementById("institution").value;
      const disc = document.getElementById("disc").value;
      const sit = document.getElementById("situation").value;
      const need = document.getElementById("need").value;

      const phrase = [
        getRandom(data.institution[inst]),
        getRandom(data.disc[disc]),
        getRandom(data.situation[sit]),
        getRandom(data.need[need])
      ].join(" ");

      document.getElementById("result").innerHTML = `<strong>У відповідь на Ваш запит можемо запропонувати:</strong><br>${phrase}`;
    }
    // Функція копіювання
  function copyText() {
    const text = document.getElementById("result").innerText.replace('У відповідь на Ваш запит можемо запропонувати:', '').trim();
    navigator.clipboard.writeText(text).then(() => alert("✅ Скопійовано!"));
  }

  // Viber
  function sendViber() {
    const msg = encodeURIComponent(document.getElementById("result").innerText);
    window.open(`viber://forward?text=${msg}`);
  }

  // Telegram
  function sendTelegram() {
    const msg = encodeURIComponent(document.getElementById("result").innerText);
    window.open(`https://t.me/share/url?url=&text=${msg}`, '_blank');
  }

  // WhatsApp
  function sendWhatsApp() {
    const msg = encodeURIComponent(document.getElementById("result").innerText);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  }
  </script>
