<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="shortcut icon" href="https://behealth.com.ua/assets/img/favicon.ico" type="img/png">
  <meta charset="UTF-8">
  <title>Діагностика навичок та оцінка візитів (ПВ ТПРК)</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
    
    .meta-block { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .meta-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .meta-field label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.95em; color: #444; }
    .meta-field input, .meta-field select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-size: 0.95em; }

    .visits-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px dashed #ccc; padding-top: 15px; }
    .visit-meta-column h3 { margin: 0 0 10px 0; color: #007acc; font-size: 1.05em; border-bottom: 1px solid #eef; padding-bottom: 5px; }
    .visit-meta-field { margin-bottom: 10px; }
    .visit-meta-field label { font-size: 0.85em; color: #555; font-weight: normal; margin-bottom: 2px; display: block; }
    .visit-meta-field input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9em; box-sizing: border-box; }

    .group-block { margin-bottom: 40px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .group-block h2 { color: #007acc; border-bottom: 2px solid #eef; padding-bottom: 8px; margin-top: 0; }
    
    .criterion { margin-bottom: 25px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
    .criterion:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .criterion label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 1.05em; }
    .criterion p { margin: 5px 0; font-size: 0.9em; color: #666; }
    
    .visits-scores-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 10px; background: #fcfcfc; padding: 12px; border: 1px solid #eaeaea; border-radius: 6px; }
    .visit-score-col label { font-size: 0.85em; color: #555; font-weight: normal; margin-bottom: 2px; display: block; }
    .visit-score-col select, .visit-score-col input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9em; box-sizing: border-box; }

    #results, #styleBlock, #recommendationBlock {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
    }
    #results { background-color: #e0ffe0; border: 1px solid #0c0; }
    #styleBlock { background-color: #eef; border: 1px solid #77c; }
    #recommendationBlock { background-color: #fff8e1; border: 1px solid #ffc107; }

    .action-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-top: 30px; text-align: center; }
    .action-container select { width: 100%; max-width: 500px; padding: 10px; margin-top: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 1em; }
    
    button { padding: 12px 25px; font-size: 16px; background-color: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; display: inline-block; margin-top: 15px; }
    button:hover { background-color: #005fa3; }
    .copy-btn { background-color: #27ae60; margin-left: 10px; }
    .copy-btn:hover { background-color: #219653; }
    .save-btn { background-color: #e67e22; margin-left: 10px; }
    .save-btn:hover { background-color: #d35400; }

    @media (max-width: 900px) {
      .visits-scores-grid { grid-template-columns: 1fr; }
      .visits-meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>🧾 Діагностика навичок та оцінка візитів (ПВ ТПРК)</h1>

  <!-- Шапка: Дані дня та Дані візитів -->
  <div class="meta-block">
    <div class="meta-row">
      <div class="meta-field">
        <label for="evalDate">Дата оцінки:</label>
        <input type="date" id="evalDate">
      </div>
      <div class="meta-field">
        <label for="mpNameSelect">Співробітник (МП):</label>
        <select id="mpNameSelect" required>
          <option value="">-- Оберіть МП --</option>
        </select>
      </div>
      <div class="meta-field">
        <label for="rmNameDisplay">Регіональний менеджер (РМ):</label>
        <input type="text" id="rmNameDisplay" readonly style="background-color: #e9ecef; font-weight: bold;">
        <input type="hidden" id="rmName">
      </div>
    </div>

    <div class="visits-meta-grid">
      <div class="visit-meta-column">
        <h3>🔹 Візит 1</h3>
        <div class="visit-meta-field">
          <label>Місто:</label>
          <input type="text" id="meta_city1" placeholder="Місто візиту 1">
        </div>
        <div class="visit-meta-field">
          <label>ЛПЗ / Аптека:</label>
          <input type="text" id="meta_lpu1" placeholder="ЛПЗ або аптека візиту 1">
        </div>
        <div class="visit-meta-field">
          <label>Прізвище лікаря:</label>
          <input type="text" id="meta_doc1" placeholder="ПІБ лікаря візиту 1">
        </div>
      </div>

      <div class="visit-meta-column">
        <h3>🔹 Візит 2</h3>
        <div class="visit-meta-field">
          <label>Місто:</label>
          <input type="text" id="meta_city2" placeholder="Місто візиту 2">
        </div>
        <div class="visit-meta-field">
          <label>ЛПЗ / Аптека:</label>
          <input type="text" id="meta_lpu2" placeholder="ЛПЗ або аптека візиту 2">
        </div>
        <div class="visit-meta-field">
          <label>Прізвище лікаря:</label>
          <input type="text" id="meta_doc2" placeholder="ПІБ лікаря візиту 2">
        </div>
      </div>
    </div>
  </div>

  <div id="formContainer">
    <!-- Сюди динамічно завантажуються критерії оцінки -->
  </div>

  <div class="action-container">
    <button onclick="calculateEvaluation()">🔍 Проаналізувати результати</button>
    
    <div id="actionFocusContainer" style="display:none; margin-top: 20px; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto;">
      <label for="focusSkillSelect" style="font-weight: bold; color: #d35400; display: block; margin-bottom: 5px;">🎯 Оберіть навик для відпрацювання (фокус розвитку):</label>
      <select id="focusSkillSelect">
        <option value="">-- Оберіть навик із зони розвитку --</option>
      </select>
    </div>
    
    <div>
      <button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyRecommendations()">📋 Скопіювати рекомендації</button>
      <button class="save-btn" id="saveBtn" style="display:none;" onclick="saveToDatabase()">💾 Зберегти в базу даних</button>
    </div>
  </div>

  <div id="results"></div>
  <div id="styleBlock"></div>
  <div id="recommendationBlock"></div>

    document.addEventListener("DOMContentLoaded", () => {
      // 1. Автоматичне визначення поточного РМ з localStorage
      const currentUserEmail = localStorage.getItem("allowedEmail") || "a.volaniuk@pharmasco.com";

      document.getElementById("rmNameDisplay").value = currentUserName;
      document.getElementById("rmName").value = currentUserName;

      // 2. Заповнення випадаючого списку підлеглих МП для цього РМ з managerToEmployees
      const mpSelect = document.getElementById("mpNameSelect");
      const subordinateEmails = managerToEmployees[currentUserEmail] || [];

      subordinateEmails.forEach(email => {
        if (users[email]) {
          const opt = document.createElement("option");
          opt.value = users[email];
          opt.textContent = users[email];
          mpSelect.appendChild(opt);
        }
      });

      // Запасний варіант: якщо у списку нікого немає, показуємо всіх МП
      if (subordinateEmails.length === 0) {
        for (let email in users) {
          const opt = document.createElement("option");
          opt.value = users[email];
          opt.textContent = users[email];
          mpSelect.appendChild(opt);
        }
      }

      // 3. Заповнення блоків критеріїв
      const container = document.getElementById("formContainer");
      const grouped = {};
      evaluationCriteria.forEach(item => {
        if (!grouped[item.group]) grouped[item.group] = [];
        grouped[item.group].push(item);
      });

      for (const groupName in grouped) {
        const groupBlock = document.createElement("div");
        groupBlock.className = "group-block";
        const title = document.createElement("h2");
        title.textContent = "🔹 " + groupName;
        groupBlock.appendChild(title);

        grouped[groupName].forEach(crit => {
          const div = document.createElement("div");
          div.className = "criterion";

          const label = document.createElement("label");
          label.textContent = crit.title;

          const desc = document.createElement("p");
          desc.textContent = crit.description;

          let critOptions = '<option value="">-- Не оцінено --</option>';
          for (let k in crit.levels) {
            critOptions += '<option value="' + k + '">Рівень ' + k + ' – ' + crit.levels[k] + '</option>';
          }

          const grid = document.createElement("div");
          grid.className = "visits-scores-grid";

          const box1 = document.createElement("div");
          box1.className = "visit-score-col";
          box1.innerHTML = 
            '<label>Оцінка (Візит 1):</label>' +
            '<select id="' + crit.id + '_v1">' + critOptions + '</select>';

          const box2 = document.createElement("div");
          box2.className = "visit-score-col";
          box2.innerHTML = 
            '<label>Оцінка (Візит 2):</label>' +
            '<select id="' + crit.id + '_v2">' + critOptions + '</select>';

          box3.className = "visit-score-col";
          box3.innerHTML = 
            '<label>Коментар / Спостереження:</label>' +
            '<input type="text" id="' + crit.id + '_comment" placeholder="Введіть коментар...">';

          grid.appendChild(box1);
          grid.appendChild(box2);
          grid.appendChild(box3);

          div.appendChild(label);
          div.appendChild(desc);
          div.appendChild(grid);
          groupBlock.appendChild(div);

    let lastEvaluationData = null;

    function calculateEvaluation() {
      const evalDate = document.getElementById("evalDate").value || "Не вказана";
      const mpName = document.getElementById("mpNameSelect").value;
      const rmName = document.getElementById("rmName").value;

      if (!mpName) {
        alert("Будь ласка, оберіть співробітника (МП) з випадаючого списку!");
        return;
      }

      const city1 = document.getElementById("meta_city1").value.trim() || "—";
      const lpu1 = document.getElementById("meta_lpu1").value.trim() || "—";
      const doc1 = document.getElementById("meta_doc1").value.trim() || "—";

      const city2 = document.getElementById("meta_city2").value.trim() || "—";
      const lpu2 = document.getElementById("meta_lpu2").value.trim() || "—";
      const doc2 = document.getElementById("meta_doc2").value.trim() || "—";

      let total = 0, count = 0;
      const lowCriteria = [];
      const criteriaDetails = [];
      const focusSelect = document.getElementById("focusSkillSelect");
      focusSelect.innerHTML = '<option value="">-- Оберіть навик із зони розвитку --</option>';

      evaluationCriteria.forEach(crit => {
        const el1 = document.getElementById(crit.id + "_v1");
        const el2 = document.getElementById(crit.id + "_v2");
        const commentEl = document.getElementById(crit.id + "_comment");
        const commentText = commentEl ? commentEl.value.trim() : "";
        
        let v1 = el1 && el1.value !== "" ? parseInt(el1.value) : null;
        let v2 = el2 && el2.value !== "" ? parseInt(el2.value) : null;
        
        let vals = [];
        if (v1 !== null) vals.push(v1);
        if (v2 !== null) vals.push(v2);

        let avgVal = null;
        if (vals.length > 0) {
          avgVal = vals.reduce((a, b) => a + b, 0) / vals.length;
          total += avgVal;
          count++;

          if (avgVal < 3) {
            lowCriteria.push({ 
              title: crit.title, 
              avg: avgVal.toFixed(1), 
              comment: commentText 
            });
            
            const opt = document.createElement("option");
            opt.value = crit.title;
            opt.textContent = crit.title + " (Середній бал: " + avgVal.toFixed(1) + ")";
            focusSelect.appendChild(opt);
          }
        }

        criteriaDetails.push({
          title: crit.title,
          v1: v1 !== null ? v1 : "—",
          v2: v2 !== null ? v2 : "—",
          avg: avgVal !== null ? avgVal.toFixed(1) : "—",
          comment: commentText
        });
      });

      if (count === 0) {
        alert("Будь ласка, оцініть хоча б кілька критеріїв перед аналізом!");
        return;
      }

      const overallAvg = (total / count).toFixed(2);
      
      let levelDesc = "";
      if (overallAvg >= 4.5) levelDesc = "Майстерний рівень виконання";
      else if (overallAvg >= 3.5) levelDesc = "Високий / Сильний рівень";
      else if (overallAvg >= 3.0) levelDesc = "Середній робочий рівень";
      else levelDesc = "Потребує розвитку / Нижче середнього";

      lastEvaluationData = {
        evalDate: evalDate,
        mpName: mpName,
        rmName: rmName,
        city1: city1,
        lpu1: lpu1,
        doc1: doc1,
        city2: city2,
        lpu2: lpu2,
        doc2: doc2,
        overallAvg: overallAvg,
        levelDesc: levelDesc,
        focusSkill: "",
        detailsJSON: JSON.stringify(criteriaDetails, null, 2)
      };

      document.getElementById("results").innerHTML = 
        "📊 <strong>Загальна інформація:</strong><br>" +
        "📅 Дата: " + evalDate + " | 👤 МП: " + mpName + " | 👨‍🏫 РМ: " + rmName + "<br>" +
        "📍 <strong>Візит 1:</strong> Місто: " + city1 + " | ЛПЗ: " + lpu1 + " | Лікар: " + doc1 + "<br>" +
        "📍 <strong>Візит 2:</strong> Місто: " + city2 + " | ЛПЗ: " + lpu2 + " | Лікар: " + doc2 + "<br><br>" +
        "⭐ <strong>Загальний середній бал:</strong> " + overallAvg + " / 5 (оцінено критеріїв: " + count + " з " + evaluationCriteria.length + ")";

      document.getElementById("styleBlock").innerHTML = "🧭 <strong>Загальна оцінка рівня:</strong> " + levelDesc + (overallAvg >= 4.5 ? " 🏆" : overallAvg >= 3.5 ? " 🚀" : overallAvg >= 3.0 ? " 👍" : " ⚠️");

      let output = "<p><strong>📌 Зони розвитку (критерії з балом нижче 3):</strong></p>";

      if (lowCriteria.length > 0) {
        output += "<ul>";
        lowCriteria.forEach(item => {
          output += "<li><strong>" + item.title + "</strong> — Середній бал: " + item.avg;
          if (item.comment) {
            output += "<br><em>Коментар: " + item.comment + "</em>";
          }
          output += "</li><br>";
        });
        output += "</ul>";
        document.getElementById("actionFocusContainer").style.display = "block";
      } else {
        output += "<p>✅ Чудово! Немає критеріїв із балом нижче 3.</p>";
        document.getElementById("actionFocusContainer").style.display = "none";
      }

      document.getElementById("recommendationBlock").innerHTML = output;
      document.getElementById("copyBtn").style.display = "inline-block";
      document.getElementById("saveBtn").style.display = "inline-block";
      document.getElementById("results").scrollIntoView({ behavior: 'smooth' });
    }

    function copyRecommendations() {
      const resultsText = document.getElementById("results").innerText;
      const styleText = document.getElementById("styleBlock").innerText;
      const recText = document.getElementById("recommendationBlock").innerText;
      const focusSkill = document.getElementById("focusSkillSelect").value;
      
      let fullText = resultsText + "\n" + styleText + "\n\n" + recText;
      if (focusSkill) {
        fullText += "\n🎯 Обраний фокус для відпрацювання: " + focusSkill;
      }
      
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Результати успішно скопійовано до буфера обміну! 📝");
      }).catch(() => {
        alert("Не вдалося скопіювати текст 😔");
      });
    }

   function saveToDatabase() {
      if (!lastEvaluationData) {
        alert("Спочатку натисніть «Проаналізувати результати»!");
        return;
      }

      const focusSkillSelect = document.getElementById("focusSkillSelect");
      const focusSkill = focusSkillSelect.value;
      
      if (!focusSkill) {
        alert("Будь ласка, оберіть навик для відпрацювання (фокус розвитку)!");
        focusSkillSelect.focus();
        return;
      }

      lastEvaluationData.focusSkill = focusSkill;
      lastEvaluationData.mode = "dual_visit_mp"; // <--- Вказуємо режим для бекенду

      localStorage.setItem("currentRmName", lastEvaluationData.rmName);
      localStorage.setItem("currentMpName", lastEvaluationData.mpName);

      const btn = document.getElementById("saveBtn");
      btn.textContent = "⏳ Зберігається...";
      btn.disabled = true;

      // URL вашого єдиного Apps Script бекенду
      const scriptURL = "https://script.google.com/macros/s/AKfycbzprTkjIf_pvCqs4iiaMehYVdFlFfuS0e60gK0QXh7v8DOKpI9WByyDo3A3VoBXzKxWxw/exec";

      fetch(scriptURL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(lastEvaluationData)
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Дані успішно збережено до аркуша «Оцінка МП (Подвійні візити)»!");
          
          let targetPage = "portfolio PV.html";
          for (const [key, page] of Object.entries(skillToPageMap)) {
            if (focusSkill.includes(key)) {
              targetPage = page;
              break;
            }
          }

          setTimeout(() => {
            window.location.href = targetPage;
          }, 1000);
        } else {
          throw new Error(data.error || "Помилка збереження");
        }
      })
      .catch((error) => {
        console.error("Помилка:", error);
        alert("❌ Сталася помилка при збереженні.");
        btn.textContent = "💾 Зберегти в базу даних";
        btn.disabled = false;
      });
    }
