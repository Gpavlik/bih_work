<script>
  function sha256(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    return crypto.subtle.digest("SHA-256", data).then(hash => {
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
  }

  <script>
  // Кнопка "До гори"
  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.onscroll = function() {
    if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
      scrollTopBtn.style.display = "block";
    } else {
      scrollTopBtn.style.display = "none";
    }
  };

  scrollTopBtn.onclick = function() {
    document.body.scrollTop = 0;
    document.documentElement.scrollTop = 0;
  };
</script>
<script>
        function showPasswordPrompt(event, url) {
            event.preventDefault(); // Зупиняємо стандартне відкриття посилання
            
            if (localStorage.getItem("accessGranted") === "true") {
                window.location.href = url; // Якщо пароль вже введено раніше, переходимо автоматично
                return;
            }

            const password = prompt("Введіть пароль:");
            const correctPassword = "12345"; // Замініть на реальний пароль

            if (password === correctPassword) {
                localStorage.setItem("accessGranted", "true"); // Зберігаємо статус входу
                window.location.href = url; // Переходимо до захищеного контенту
            } else {
                alert("Неправильний пароль!");
            }
        }
    </script>
