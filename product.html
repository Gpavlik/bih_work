    /* Стилі для модального вікна тестування */
    .quiz-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .quiz-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    .quiz-modal-content {
      top: 5%;
      background: #ffffff;
      width: 100%;
      max-width: 780px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 12px;
      position: fixed;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 40px 45px;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    .quiz-modal-overlay.active .quiz-modal-content {
      transform: translateY(0);
    }
    .quiz-close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      background: none;
      border: none;
      font-size: 32px;
      cursor: pointer;
      color: #64748b;
      transition: color 0.2s;
    }
    .quiz-close-btn:hover {
      color: #0f172a;
    }

    .quiz-option-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      background-color: #f8fafc;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    .quiz-option-card:hover {
      border-color: #069606;
      background-color: #f0fdf4;
    }
    .quiz-option-card.selected {
      border-color: #069606;
      background-color: #f0fdf4;
      font-weight: 600;
    }
    .quiz-option-card input[type="radio"] {
      width: 20px;
      height: 20px;
      accent-color: #069606;
      cursor: pointer;
      flex-shrink: 0;
    }

    body.dark-mode .quiz-modal-content {
      background-color: #2f303a !important;
      color: #22c55e !important;
      border: 1px solid #4a4b52;
    }

  <!-- Скрипт життєвого циклу навчання для продукту -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby87iUOv2tul_QrIBiuJ8JgcfCOl4WQ3igIuIDNWpZS4CN2y27RRtD752dyePFZRvGf8A/exec";
    const allowedEmail = localStorage.getItem("allowedEmail");
    
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    async function updateProductTaskStatus(status) {
      if (!allowedEmail || !productId) return;
      try {
        const payload = {
          action: "updateCourseStatus",
          email: allowedEmail,
          courseUrl: productId,
          status: status
        };
        const params = new URLSearchParams(payload).toString();
        
        await fetch(`${SCRIPT_URL}?${params}`, {
          method: "GET"
        });
      } catch (err) {
        console.error("Помилка оновлення статусу продукту:", err);
      }
    }

    window.handleTestCompletion = async function(scorePercentage) {
      let wrapper = document.getElementById("quiz-main-wrapper");
      if (scorePercentage >= 90) {
        await updateProductTaskStatus("Виконано");
        if (wrapper) {
          wrapper.innerHTML = `
            <div style="text-align: center; padding: 20px;">
              <h3 style="color: #069606; margin-bottom: 10px;">🎉 Вітаємо! Тест складено успішно!</h3>
              <p>Ваш результат: <b>${scorePercentage}%</b> (необхідно від 90%).</p>
              <p style="margin-top: 15px; color: #64748b;">Статус завдання оновлено на: <b>Виконано</b>.</p>
            </div>
          `;
        }
      } else {
        await updateProductTaskStatus("Доопрацювати");
        if (wrapper) {
          wrapper.innerHTML = `
            <div style="text-align: center; padding: 20px;">
              <h3 style="color: #e74c3c; margin-bottom: 10px;">⚠️ Тест не складено</h3>
              <p>Ваш результат: <b>${scorePercentage}%</b> (потрібно мінімум 90%).</p>
              <p style="margin-top: 10px; color: #64748b;">Статус завдання змінено на: <b>Доопрацювати</b>.</p>
              <button id="retryQuizBtn" class="btn-link" style="margin-top: 20px; background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Пройти тест повторно</button>
            </div>
          `;

          document.getElementById("retryQuizBtn").addEventListener("click", async () => {
            await updateProductTaskStatus("Доопрацювати");
            alert("Запит на повторне проходження надіслано керівнику.");
            location.reload();
          });
        }
      }
    };
  </script>

  <!-- Дружня хмарка повідомлення (розміщена праворуч від кнопок або у зручній зоні екрана) -->
  <div class="mascot-bubble" onclick="toggleMascotMenu(event)">
    <span class="mascot-greeting">Привіт, я Бі-хелсі! 👋</span>
    <span class="mascot-status">Натисни на мене для вибору дії</span>
    <div class="sound-waves">
      <span></span><span></span><span></span><span></span>
    </div>
  </div>
</div>

<style>
/* Покращені та стильні стилі для маскота Бі-хелсі */
.mascot-widget {
  position: fixed;
  bottom: 30px;
  right: 30px;
  display: flex;
  align-items: center;
  background: linear-gradient(135deg, #ffffff 0%, #f4fbf1 100%);
  padding: 10px 18px 10px 10px;
  
  box-shadow: 0 10px 30px rgba(39, 174, 96, 0.18);
  border: 2px solid #a3d99f;
  z-index: 9999;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  user-select: none;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes mascotFloat {
  0% {
    transform: translateY(0px) rotate(0deg);
  }
  50% {
    transform: translateY(-6px) rotate(1deg);
  }
  100% {
    transform: translateY(0px) rotate(0deg);
  }
}

@keyframes mascotPulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.04);
  }
  100% {
    transform: scale(1);
  }
}

/* Застосовуємо анімацію до аватарки маскота */
.mascot-avatar {
  animation: mascotFloat 3.5s ease-in-out infinite;
}

/* При наведенні він трохи збільшується і «оживає» ще активніше */
.mascot-widget:hover .mascot-avatar {
  animation: mascotPulse 1s ease-in-out infinite;
}

.mascot-widget:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 35px rgba(39, 174, 96, 0.28);
}

.mascot-avatar {
  position: relative;
  width: 68px;
  height: 68px;
  background: linear-gradient(135deg, #e4fa9f 0%, #bdf75a 100%);
  color: #ffffff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
}

.mascot-bubble {
  margin-left: 14px;
  display: flex;
  flex-direction: column;
}

.mascot-greeting {
  font-size: 13px;
  font-weight: 700;
  color: #27ae60;
}

.mascot-status {
  font-size: 12px;
  color: #475569;
  font-weight: 500;
  max-width: 210px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Анімація звукових хвиль */
.sound-waves {
  display: none;
  align-items: center;
  gap: 3px;
  height: 12px;
  margin-top: 4px;
}

.sound-waves span {
  display: block;
  width: 3px;
  height: 100%;
  background: #27ae60;
  border-radius: 3px;
  animation: waveAnim 0.6s infinite ease-in-out alternate;
}

.sound-waves span:nth-child(2) { animation-delay: 0.15s; }
.sound-waves span:nth-child(3) { animation-delay: 0.3s; }
.sound-waves span:nth-child(4) { animation-delay: 0.45s; }

@keyframes waveAnim {
  0% { height: 4px; }
  100% { height: 12px; }
}

/* Стан активного говоріння */
.mascot-widget.speaking {
  border-color: #27ae60;
  background: #f0fdf4;
  box-shadow: 0 10px 35px rgba(39, 174, 96, 0.3);
}

.mascot-widget.speaking .mascot-pulse {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid #27ae60;
  animation: pulseAnim 1.5s infinite;
}

@keyframes pulseAnim {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

.mascot-widget.speaking .sound-waves {
  display: flex;
}

.mascot-widget.speaking .mascot-status {
  color: #27ae60;
  font-weight: 600;
}

/* Преміальне виринаюче меню */
.mascot-menu {
  position: absolute;
  bottom: 75px;
  right: 0;
  width: 300px;
  background: #ffffff;
  height: auto;  
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
  border: 1px solid #e2f0d9;
  padding: 18px;
  display: none;
  flex-direction: column;
  z-index: 10000;
  animation: menuAppear 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: default;
}

.mascot-menu.active {
  display: flex;
}

@keyframes menuAppear {
  from { opacity: 0; transform: translateY(15px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.mascot-menu-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #f1f5f9;
  padding-bottom: 10px;
  margin-bottom: 10px;
}

.mascot-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mascot-badge-dot {
  width: 8px;
  height: 8px;
  background-color: #27ae60;
  border-radius: 50%;
  box-shadow: 0 0 6px #27ae60;
}

.mascot-name {
  font-weight: 700;
  font-size: 14px;
  color: #1e293b;
}

.mascot-close-btn {
  background: #f1f5f9;
  border: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  color: #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.mascot-close-btn:hover {
  background: #fee2e2;
  color: #ef4444;
}

.mascot-question {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 12px;
  font-weight: 500;
}

.mascot-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 408px;
  overflow-y: auto;
  padding-right: 4px;
}

.mascot-action-btn {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  padding: 9px 12px;
  text-align: left;
  font-size: 13px;
  font-weight: 500;
  color: #334155;
  cursor: pointer;
  transition: all 0.2s ease;
}

.mascot-action-btn:hover {
  background: #f0fdf4;
  border-color: #27ae60;
  color: #27ae60;
  transform: translateX(3px);
}
</style>
