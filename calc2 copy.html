<!DOCTYPE html>
<html lang="uk">
<head>
  <link rel="shortcut icon" href="https://behealth.com.ua/assets/img/favicon.ico" type="img/png">
  <meta charset="UTF-8">
  <title>Діагностика навичок та оцінка візитів (ПВ ТПРК)</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; }
    h1 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
    
    .meta-block { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-bottom: 30px; }
    .meta-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .meta-field label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.95em; color: #444; }
    .meta-field input, .meta-field select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; font-size: 0.95em; }

    .visits-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; border-top: 1px dashed #ccc; padding-top: 15px; }
    .visit-meta-column { background: #fafafa; padding: 12px; border-radius: 6px; border: 1px solid #eee; }
    .visit-meta-column h3 { margin: 0 0 10px 0; color: #007acc; font-size: 1em; border-bottom: 1px solid #eef; padding-bottom: 5px; }
    .visit-meta-field { margin-bottom: 8px; }
    .visit-meta-field label { font-size: 0.85em; color: #555; font-weight: normal; margin-bottom: 2px; display: block; }
    .visit-meta-field input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.9em; box-sizing: border-box; }

    .group-block { margin-bottom: 40px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    .group-block h2 { color: #007acc; border-bottom: 2px solid #eef; padding-bottom: 8px; margin-top: 0; }
    
    .criterion { margin-bottom: 25px; border-bottom: 1px solid #f0f0f0; padding-bottom: 15px; }
    .criterion:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .criterion label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 1.05em; }
    .criterion p { margin: 5px 0; font-size: 0.9em; color: #666; }
    
    .visits-scores-grid { display: grid; grid-template-columns: repeat(4, 1fr) 1.5fr; gap: 8px; margin-top: 10px; background: #fcfcfc; padding: 12px; border: 1px solid #eaeaea; border-radius: 6px; }
    .visit-score-col label { font-size: 0.8em; color: #555; font-weight: normal; margin-bottom: 2px; display: block; }
    .visit-score-col select, .visit-score-col input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 0.85em; box-sizing: border-box; }

    /* Стилі тогл-світча */
    .switch-field { display: inline-flex; background: #e2e8f0; padding: 4px; border-radius: 30px; margin-top: 10px; }
    .switch-field input { display: none; }
    .switch-field label { padding: 10px 22px; font-weight: bold; cursor: pointer; border-radius: 25px; transition: all 0.3s ease; color: #475569; font-size: 0.95em; }
    .switch-field input:checked + label { background: #007acc; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

    #results, #styleBlock, #recommendationBlock {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
    }
    #results { background-color: #e0ffe0; border: 1px solid #0c0; }
    #styleBlock { background-color: #eef; border: 1px solid #77c; }
    #recommendationBlock { background-color: #fff8e1; border: 1px solid #ffc107; }

    .auto-focus-card {
      background: #fff3cd;
      border: 2px solid #ffeba2;
      border-left: 6px solid #d35400;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 1em;
    }
    .auto-focus-card h4 { margin: 0 0 8px 0; color: #d35400; font-size: 1.1em; }

    .action-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); margin-top: 30px; text-align: center; }
    
    button { padding: 12px 25px; font-size: 16px; background-color: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; display: inline-block; margin-top: 15px; }
    button:hover { background-color: #005fa3; }
    .copy-btn { background-color: #27ae60; margin-left: 10px; }
    .copy-btn:hover { background-color: #219653; }
    .save-btn { background-color: #e67e22; margin-left: 10px; }
    .save-btn:hover { background-color: #d35400; }

    @media (max-width: 1100px) {
      .visits-scores-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .visits-scores-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>🧾 Діагностика навичок та оцінка візитів (ПВ ТПРК)</h1>

  <div class="meta-block">
    <div class="meta-row">
      <div class="meta-field">
        <label for="evalDate">Дата оцінки:</label>
        <input type="date" id="evalDate">
      </div>
      <div class="meta-field">
        <label for="mpNameSelect">Співробітник (МП):</label>
        <select id="mpNameSelect" onchange="loadPreviousPvSkill()" required>
          <option value="">⏳ Завантаження списку МП...</option>
        </select>
      </div>
      <div class="meta-field">
        <label for="rmNameDisplay">Регіональний менеджер (РМ):</label>
        <input type="text" id="rmNameDisplay" readonly style="background-color: #e9ecef; font-weight: bold;">
        <input type="hidden" id="rmName">
      </div>
    </div>

    <!-- Відображення навику з минулого ПВ -->
    <div id="prevSkillInfo" style="font-size: 0.9em; color: #555; background: #f8fafc; padding: 8px 12px; border-radius: 5px; margin-bottom: 15px; display: none;">
      🔄 <strong>Навик з минулого ПВ:</strong> <span id="prevSkillName" style="color: #25a72b; font-weight: bold;">—</span>
    </div>

    <div class="visits-meta-grid">
      <div class="visit-meta-column">
        <h3>🩺 Візит 1 (Лікар)</h3>
        <div class="visit-meta-field"><label>Місто:</label><input type="text" id="meta_city1" placeholder="Місто візиту 1"></div>
        <div class="visit-meta-field"><label>ЛПЗ:</label><input type="text" id="meta_lpu1" placeholder="ЛПЗ"></div>
        <div class="visit-meta-field"><label>Лікар:</label><input type="text" id="meta_doc1" placeholder="ПІБ лікаря"></div>
      </div>

      <div class="visit-meta-column">
        <h3>🩺 Візит 2 (Лікар)</h3>
        <div class="visit-meta-field"><label>Місто:</label><input type="text" id="meta_city2" placeholder="Місто візиту 2"></div>
        <div class="visit-meta-field"><label>ЛПЗ:</label><input type="text" id="meta_lpu2" placeholder="ЛПЗ"></div>
        <div class="visit-meta-field"><label>Лікар:</label><input type="text" id="meta_doc2" placeholder="ПІБ лікаря"></div>
      </div>

      <div class="visit-meta-column">
        <h3>💊 Візит 3 (Аптека 1)</h3>
        <div class="visit-meta-field"><label>Місто:</label><input type="text" id="meta_city3" placeholder="Місто візиту 3"></div>
        <div class="visit-meta-field"><label>Аптека/Мережа:</label><input type="text" id="meta_lpu3" placeholder="Аптека"></div>
        <div class="visit-meta-field"><label>Завідуюча / Фармацевт:</label><input type="text" id="meta_doc3" placeholder="ПІБ завідуючої"></div>
      </div>

      <div class="visit-meta-column">
        <h3>💊 Візит 4 (Аптека 2)</h3>
        <div class="visit-meta-field"><label>Місто:</label><input type="text" id="meta_city4" placeholder="Місто візиту 4"></div>
        <div class="visit-meta-field"><label>Аптека/Мережа:</label><input type="text" id="meta_lpu4" placeholder="Аптека"></div>
        <div class="visit-meta-field"><label>Завідуюча / Фармацевт:</label><input type="text" id="meta_doc4" placeholder="ПІБ завідуючої"></div>
      </div>
    </div>
  </div>

  <div id="formContainer"></div>

  <div class="action-container">
    <div style="margin-bottom: 15px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px; color: #2c3e50;">🎯 Оберіть напрямок візитів для розрахунку ДЗ (фокусу розвитку):</label>
      <div class="switch-field">
        <input type="radio" id="evalDoctor" name="evalType" value="doctor" checked>
        <label for="evalDoctor">🩺 По ВІЗИТАХ ДО ЛІКАРІВ (1 та 2)</label>
        
        <input type="radio" id="evalPharmacy" name="evalType" value="pharmacy">
        <label for="evalPharmacy">💊 По ВІЗИТАХ В АПТЕКИ (3 та 4)</label>
      </div>
    </div>

    <button onclick="calculateEvaluation()">🔍 Автоматично розрахувати результати</button>
    
    <div>
      <button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyRecommendations()">📋 Скопіювати рекомендації</button>
      <button class="save-btn" id="saveBtn" style="display:none;" onclick="saveToDatabase()">💾 Зберегти та автоперейти до призначення ДЗ</button>
    </div>
  </div>

  <div id="results"></div>
  <div id="styleBlock"></div>
  <div id="recommendationBlock"></div>

      { "id": "crit_27", "group": "Аналіз візиту та самооцінка", "title": "Декларація мети візиту", "skillId": "PV10", "description": "Створення короткої та ефективної декларованої мети.", "levels": { "1": "Не ставить", "2": "Без БРТ / SMART", "3": "Чітко та ефективно" } },
      
      // СПЕЦІАЛЬНІ АПТЕЧНІ КРИТЕРІЇ (Оцінюються у загальному балі, але НЕ ВХОДЯТЬ до пріоритетів PV1-PV10)
      { "id": "crit_28", "group": "Робота в аптеці", "title": "Мерчендайзинг", "skillId": null, "pharmacyOnly": true, "description": "Оцінка викладки препаратів на полицях та вітринах аптеки.", "levels": { "1": "Не робив викладки", "2": "Викладка препаратів зроблена частково", "3": "Викладка препаратів зроблена повністю, або неможлива" } },
      { "id": "crit_29", "group": "Робота в аптеці", "title": "Робота з завідуючою", "skillId": null, "pharmacyOnly": true, "description": "Формування та контроль дозамовлення товарного запасу.", "levels": { "1": "Не зробив дозамовлення", "2": "Дозамовлення зроблено не по всіх потрібних позиціях", "3": "Дозамовлення зроблено по всіх потрібних позиціях" } }
    ];

    let previousPvSkill = null; 
    let lastEvaluationData = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const allowedEmail = (localStorage.getItem("allowedEmail") || "").toLowerCase();
      const userRole = (localStorage.getItem("userRole") || "").toLowerCase();
      const userFullName = localStorage.getItem("userFullName") || allowedEmail;

      document.getElementById("rmNameDisplay").value = userFullName;
      document.getElementById("rmName").value = userFullName;
      document.getElementById("evalDate").value = new Date().toISOString().split('T')[0];

      // Динамічне заповнення підлеглих МП з Деканату
      const mpSelect = document.getElementById("mpNameSelect");
      try {
        const response = await fetch(`${DECANAT_SCRIPT_URL}?action=getUsersHierarchy`);
        const json = await response.json();

        if (json.status === "success" && json.users) {
          mpSelect.innerHTML = '<option value="">-- Оберіть МП --</option>';
          
          let targetMPs = json.users.filter(u => (u.role || '').toLowerCase() === "mp");
          
          if (userRole === "rm") {
            const subordinates = json.users.filter(u => (u.manager || '').toLowerCase() === allowedEmail && (u.role || '').toLowerCase() === "mp");
            if (subordinates.length > 0) {
              targetMPs = subordinates;
            }
          }

          targetMPs.forEach(u => {
            const opt = document.createElement("option");
            opt.value = u.login;
            opt.dataset.fullname = u.fullName || u.login;
            opt.textContent = `${u.fullName || u.login} (${u.login})`;
            mpSelect.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Помилка завантаження ієрархії:", err);
        mpSelect.innerHTML = '<option value="">❌ Помилка завантаження даних</option>';
      }

      // Генерація інтерфейсу критеріїв
      const container = document.getElementById("formContainer");
      const grouped = {};
      evaluationCriteria.forEach(item => {
        if (!grouped[item.group]) grouped[item.group] = [];
        grouped[item.group].push(item);
      });

      for (const groupName in grouped) {
        const groupBlock = document.createElement("div");
        groupBlock.className = "group-block";
        const title = document.createElement("h2");
        title.textContent = "🔹 " + groupName;
        groupBlock.appendChild(title);

        grouped[groupName].forEach(crit => {
          const div = document.createElement("div");
          div.className = "criterion";

          const label = document.createElement("label");
          label.textContent = crit.title;

          const desc = document.createElement("p");
          desc.textContent = crit.description;

          let critOptions = '<option value="">-- Не оцінено --</option>';
          for (let k in crit.levels) {
            critOptions += '<option value="' + k + '">Рівень ' + k + ' – ' + crit.levels[k] + '</option>';
          }

          const grid = document.createElement("div");
          grid.className = "visits-scores-grid";

          if (crit.pharmacyOnly) {
            // ДЛЯ АПТЕЧНИХ КРИТЕРІЇВ ВІЗИТИ 1 ТА 2 ВІДКЛЮЧЕНІ
            grid.innerHTML = `
              <div class="visit-score-col" style="opacity:0.4;"><label>Візит 1 (Лікар 1):</label><select disabled><option>⛔ Тільки аптека</option></select></div>
              <div class="visit-score-col" style="opacity:0.4;"><label>Візит 2 (Лікар 2):</label><select disabled><option>⛔ Тільки аптека</option></select></div>
              <div class="visit-score-col"><label>Візит 3 (Аптека 1):</label><select id="${crit.id}_v3">${critOptions}</select></div>
              <div class="visit-score-col"><label>Візит 4 (Аптека 2):</label><select id="${crit.id}_v4">${critOptions}</select></div>
              <div class="visit-score-col"><label>Коментар / Спостереження:</label><input type="text" id="${crit.id}_comment" placeholder="Введіть коментар..."></div>
            `;
          } else {
            grid.innerHTML = `
              <div class="visit-score-col"><label>Візит 1 (Лікар 1):</label><select id="${crit.id}_v1">${critOptions}</select></div>
              <div class="visit-score-col"><label>Візит 2 (Лікар 2):</label><select id="${crit.id}_v2">${critOptions}</select></div>
              <div class="visit-score-col"><label>Візит 3 (Аптека 1):</label><select id="${crit.id}_v3">${critOptions}</select></div>
              <div class="visit-score-col"><label>Візит 4 (Аптека 2):</label><select id="${crit.id}_v4">${critOptions}</select></div>
              <div class="visit-score-col"><label>Коментар / Спостереження:</label><input type="text" id="${crit.id}_comment" placeholder="Введіть коментар..."></div>
            `;
          }

          div.appendChild(label);
          div.appendChild(desc);
          div.appendChild(grid);
          groupBlock.appendChild(div);
        });

        container.appendChild(groupBlock);
      }
    });

    async function loadPreviousPvSkill() {
      const mpSelectEl = document.getElementById("mpNameSelect");
      const mpEmail = mpSelectEl.value;
      const prevInfoBlock = document.getElementById("prevSkillInfo");
      const prevSkillText = document.getElementById("prevSkillName");

      previousPvSkill = null;
      if (!mpEmail) {
        prevInfoBlock.style.display = "none";
        return;
      }

      try {
        const response = await fetch(`${HUB_SCRIPT_URL}?action=getLastEvaluation&email=${encodeURIComponent(mpEmail)}`);
        const json = await response.json();
        if (json.status === "success" && json.lastFocusSkill) {
          previousPvSkill = json.lastFocusSkill;
          prevSkillText.textContent = previousPvSkill;
          prevInfoBlock.style.display = "block";
        } else {
          prevSkillText.textContent = "Немає попередніх даних";
          prevInfoBlock.style.display = "block";
        }
      } catch (err) {
        console.warn("Не вдалося завантажити попередній ПВ з бази:", err);
        prevInfoBlock.style.display = "none";
      }
    }

    function calculateEvaluation() {
      const evalDate = document.getElementById("evalDate").value || "Не вказана";
      const mpSelectEl = document.getElementById("mpNameSelect");
      const selectedOption = mpSelectEl.options[mpSelectEl.selectedIndex];
      
      const mpEmail = mpSelectEl.value;
      const mpName = selectedOption ? (selectedOption.dataset.fullname || selectedOption.text) : "";
      const rmName = document.getElementById("rmName").value;

      if (!mpEmail) {
        alert("Будь ласка, оберіть співробітника (МП) з випадаючого списку!");
        return;
      }

      const evalType = document.querySelector('input[name="evalType"]:checked').value; // "doctor" або "pharmacy"

      const city1 = document.getElementById("meta_city1").value.trim() || "—";
      const lpu1 = document.getElementById("meta_lpu1").value.trim() || "—";
      const doc1 = document.getElementById("meta_doc1").value.trim() || "—";

      const city2 = document.getElementById("meta_city2").value.trim() || "—";
      const lpu2 = document.getElementById("meta_lpu2").value.trim() || "—";
      const doc2 = document.getElementById("meta_doc2").value.trim() || "—";

      const city3 = document.getElementById("meta_city3").value.trim() || "—";
      const lpu3 = document.getElementById("meta_lpu3").value.trim() || "—";
      const doc3 = document.getElementById("meta_doc3").value.trim() || "—";

      const city4 = document.getElementById("meta_city4").value.trim() || "—";
      const lpu4 = document.getElementById("meta_lpu4").value.trim() || "—";
      const doc4 = document.getElementById("meta_doc4").value.trim() || "—";

      // 1. ЗАГАЛЬНИЙ РОЗРАХУНОК ДЛЯ БЕКЕНДУ І ГРЕЙДУ (по ВСІХ оцінених візитах 1, 2, 3, 4)
      let totalOverallScore = 0;
      let evaluatedCriteriaCount = 0;

      // 2. СТРУКТУРА ДЛЯ ВИБОРУ НАВИКУ ЗА ТОГЛ-СВІТЧЕМ (doctor: v1,v2 / pharmacy: v3,v4)
      const skillStats = {};
      SKILL_PRIORITY_MATRIX.forEach(s => {
        skillStats[s.id] = {
          matrixItem: s,
          scores: [],
          hasLevelOne: false,
          criteriaComments: []
        };
      });

      const criteriaDetails = [];

      evaluationCriteria.forEach(crit => {
        const el1 = document.getElementById(crit.id + "_v1");
        const el2 = document.getElementById(crit.id + "_v2");
        const el3 = document.getElementById(crit.id + "_v3");
        const el4 = document.getElementById(crit.id + "_v4");
        const commentEl = document.getElementById(crit.id + "_comment");
        const commentText = commentEl ? commentEl.value.trim() : "";
        
        let v1 = el1 && el1.value !== "" ? parseInt(el1.value) : null;
        let v2 = el2 && el2.value !== "" ? parseInt(el2.value) : null;
        let v3 = el3 && el3.value !== "" ? parseInt(el3.value) : null;
        let v4 = el4 && el4.value !== "" ? parseInt(el4.value) : null;
        
        // --- АГРЕГАЦІЯ БАЛІВ ПО ВСІХ ВІЗИТАХ (ДЛЯ ГРЕЙДУ ПВ) ---
        let allVals = [];
        if (v1 !== null) allVals.push(v1);
        if (v2 !== null) allVals.push(v2);
        if (v3 !== null) allVals.push(v3);
        if (v4 !== null) allVals.push(v4);

        let globalAvgVal = null;
        if (allVals.length > 0) {
          globalAvgVal = allVals.reduce((a, b) => a + b, 0) / allVals.length;
          totalOverallScore += globalAvgVal;
          evaluatedCriteriaCount++;
        }

        // --- АГРЕГАЦІЯ ДЛЯ ФОКУСНОГО НАВИКУ (ЗА ТОГЛ-СВІТЧЕМ) ---
        // Лише для критеріїв, що входять до пріоритетів PV1..PV10
        if (crit.skillId && skillStats[crit.skillId]) {
          let targetVals = [];
          if (evalType === "doctor") {
            if (v1 !== null) { targetVals.push(v1); if (v1 === 1) skillStats[crit.skillId].hasLevelOne = true; }
            if (v2 !== null) { targetVals.push(v2); if (v2 === 1) skillStats[crit.skillId].hasLevelOne = true; }
          } else {
            if (v3 !== null) { targetVals.push(v3); if (v3 === 1) skillStats[crit.skillId].hasLevelOne = true; }
            if (v4 !== null) { targetVals.push(v4); if (v4 === 1) skillStats[crit.skillId].hasLevelOne = true; }
          }

          if (targetVals.length > 0) {
            let focusAvgVal = targetVals.reduce((a, b) => a + b, 0) / targetVals.length;
            skillStats[crit.skillId].scores.push(focusAvgVal);
            if (commentText) {
              skillStats[crit.skillId].criteriaComments.push(`${crit.title}: ${commentText}`);
            }
          }
        }

        criteriaDetails.push({
          title: crit.title,
          v1: v1 !== null ? v1 : "—",
          v2: v2 !== null ? v2 : "—",
          v3: v3 !== null ? v3 : "—",
          v4: v4 !== null ? v4 : "—",
          avg: globalAvgVal !== null ? globalAvgVal.toFixed(1) : "—",
          comment: commentText
        });
      });

      if (evaluatedCriteriaCount === 0) {
        alert("Будь ласка, заповніть оцінки хоча б для кількох критеріїв!");
        return;
      }

      // --- АЛГОРИТМ ВИЗНАЧЕННЯ НАВИКУ ДЛЯ ВІДПРАЦЮВАННЯ ---
      let calculatedFocusSkill = null;
      let selectionReason = "";

      const evaluatedSkillsList = [];
      for (const skillId in skillStats) {
        const stat = skillStats[skillId];
        if (stat.scores.length > 0) {
          const avgScore = stat.scores.reduce((a, b) => a + b, 0) / stat.scores.length;
          evaluatedSkillsList.push({
            id: skillId,
            name: stat.matrixItem.name,
            rank: stat.matrixItem.rank,
            page: stat.matrixItem.page,
            avgScore: avgScore,
            hasLevelOne: stat.hasLevelOne,
            comments: stat.criteriaComments
          });
        }
      }

      // Правило №1: Повторний навик з минулого ПВ має бал 1 у вибраному напрямку
      if (previousPvSkill) {
        const prevSkillLower = previousPvSkill.toLowerCase();
        const repeatFailedSkill = evaluatedSkillsList.find(s => 
          prevSkillLower.includes(s.name.toLowerCase()) && s.hasLevelOne
        );

        if (repeatFailedSkill) {
          calculatedFocusSkill = repeatFailedSkill;
          selectionReason = `🔴 **Правило №1 (Супер-пріоритет):** Навик "${repeatFailedSkill.name}" відпрацьовувався на минулому ПВ і отримав бал 1 на поточному візиті (${evalType === 'doctor' ? 'Лікар' : 'Аптека'}). Призначається повторно!`;
        }
      }

      // Правило №2 та №3: Пошук найнижчого балу + відбір за матрицею пріоритетів
      if (!calculatedFocusSkill && evaluatedSkillsList.length > 0) {
        evaluatedSkillsList.sort((a, b) => {
          if (Math.abs(a.avgScore - b.avgScore) > 0.05) {
            return a.avgScore - b.avgScore;
          }
          return a.rank - b.rank;
        });

        const topWeakSkill = evaluatedSkillsList[0];
        if (topWeakSkill.avgScore < 3.0) {
          calculatedFocusSkill = topWeakSkill;
          selectionReason = `🎯 **Правило №2 та №3 (Авто-вибір):** Обрано навик "${topWeakSkill.name}" (Середній бал: ${topWeakSkill.avgScore.toFixed(1)} / 3.0, Пріоритет №${topWeakSkill.rank} за стандартом)`;
        } else {
          calculatedFocusSkill = topWeakSkill;
          selectionReason = `✅ Усі оцінені навички продемонстровано на найвищому рівні (3.0). Для профілактики обрано: "${topWeakSkill.name}"`;
        }
      }

      // РОЗРАХУНОК ЗАГАЛЬНОГО СЕРЕДНЬОГО БАЛУ ДЛЯ ГРЕЙДУ БЕКЕНДУ
      const overallAvg = (totalOverallScore / evaluatedCriteriaCount).toFixed(2);
      
      let levelDesc = "";
      if (overallAvg >= 2.7) levelDesc = "Майстерний рівень виконання (90-100%)";
      else if (overallAvg >= 2.3) levelDesc = "Високий / Сильний рівень (76-89%)";
      else if (overallAvg >= 2.0) levelDesc = "Середній робочий рівень (66-75%)";
      else levelDesc = "Потребує розвитку / Нижче середнього (< 66%)";

      lastEvaluationData = {
        evalDate: evalDate,
        evalType: evalType,
        mpName: mpName,
        mpEmail: mpEmail,
        rmName: rmName,
        city1, lpu1, doc1,
        city2, lpu2, doc2,
        city3, lpu3, doc3,
        city4, lpu4, doc4,
        overallAvg: overallAvg, // Загальний бал по сторінці для грейдів
        levelDesc: levelDesc,
        focusSkill: calculatedFocusSkill ? calculatedFocusSkill.name : "",
        targetPage: calculatedFocusSkill ? calculatedFocusSkill.page : "portfolio PV.html",
        detailsJSON: JSON.stringify(criteriaDetails, null, 2)
      };

      document.getElementById("results").innerHTML = 
        "📊 <strong>Загальна аналітика сесії ПВ (для бекенду та грейдів):</strong><br>" +
        "📅 Дата: " + evalDate + " | 👤 МП: " + mpName + " (" + mpEmail + ") | 👨‍🏫 РМ: " + rmName + "<br>" +
        "📍 <strong>Візити 1-2 (Лікарі):</strong> " + city1 + " (" + doc1 + "), " + city2 + " (" + doc2 + ")<br>" +
        "📍 <strong>Візити 3-4 (Аптеки):</strong> " + city3 + " (" + lpu3 + "), " + city4 + " (" + lpu4 + ")<br><br>" +
        "⭐ <strong>Загальний середній бал ПВ (всі візити):</strong> " + overallAvg + " / 3.0 (оцінено критеріїв: " + evaluatedCriteriaCount + ")";

      document.getElementById("styleBlock").innerHTML = "🧭 <strong>Загальна оцінка рівня / Грейд ПВ:</strong> " + levelDesc;

      let output = `<div class="auto-focus-card">
        <h4>🎯 Обраний фокус розвитку (${evalType === 'doctor' ? 'по Лікарях' : 'по Аптеках'}):</h4>
        <p style="font-size: 1.1em; font-weight: bold; margin: 5px 0;">👉 ${calculatedFocusSkill ? calculatedFocusSkill.name : '—'}</p>
        <p style="margin: 5px 0; font-size: 0.95em;">${selectionReason}</p>
      </div>`;

      output += `<p style='margin-top: 15px;'><strong>📌 Зони розвитку за напрямком "${evalType === 'doctor' ? 'Лікарі' : 'Аптеки'}":</strong></p><ul>`;
      evaluatedSkillsList.filter(s => s.avgScore < 3.0).forEach(item => {
        output += `<li><strong>${item.name}</strong> (Пріоритет №${item.rank}) — Середній бал: ${item.avgScore.toFixed(1)}`;
        if (item.comments.length > 0) output += `<br><em>${item.comments.join('; ')}</em>`;
        output += "</li><br>";
      });
      output += "</ul>";

      document.getElementById("recommendationBlock").innerHTML = output;
      document.getElementById("copyBtn").style.display = "inline-block";
      document.getElementById("saveBtn").style.display = "inline-block";
      document.getElementById("results").scrollIntoView({ behavior: 'smooth' });
    }

    function copyRecommendations() {
      const resultsText = document.getElementById("results").innerText;
      const styleText = document.getElementById("styleBlock").innerText;
      const recText = document.getElementById("recommendationBlock").innerText;
      
      let fullText = resultsText + "\n" + styleText + "\n\n" + recText;
      
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Результати успішно скопійовано до буфера обміну! 📝");
      }).catch(() => {
        alert("Не вдалося скопіювати текст 😔");
      });
    }

    function saveToDatabase() {
      if (!lastEvaluationData) {
        alert("Спочатку натисніть «Автоматично розрахувати результати»!");
        return;
      }

      localStorage.setItem("currentRmName", lastEvaluationData.rmName);
      localStorage.setItem("currentMpName", lastEvaluationData.mpName);
      localStorage.setItem("currentMpEmail", lastEvaluationData.mpEmail);

      const btn = document.getElementById("saveBtn");
      btn.textContent = "⏳ Зберігається...";
      btn.disabled = true;

      fetch(HUB_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(lastEvaluationData)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success" || data.success) {
          alert(`✅ Оцінку збережено! Автоматичний перехід на сторінку ДЗ: ${lastEvaluationData.focusSkill}`);

          setTimeout(() => { 
            window.location.href = lastEvaluationData.targetPage || "portfolio PV.html"; 
          }, 800);
        } else {
          throw new Error(data.message || "Помилка збереження");
        }
      })
      .catch((error) => {
        console.error("Помилка:", error);
        alert("❌ Сталася помилка при збереженні.");
        btn.textContent = "💾 Зберегти та автоперейти до призначення ДЗ";
        btn.disabled = false;
      });
    }
  </script>
