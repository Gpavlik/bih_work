<script>
  function sha256(input) {
    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    return crypto.subtle.digest("SHA-256", data).then(hash => {
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
  }
</script>
<script>
    function sendMail() {
      const name = encodeURIComponent(document.getElementById("name").value.trim());
      const email = encodeURIComponent(document.getElementById("email").value.trim());
      const message = encodeURIComponent(document.getElementById("message").value.trim());

      const subject = encodeURIComponent("Пропозиція від " + decodeURIComponent(name));
      const body = `Ім’я: ${name}%0D%0AEmail: ${email}%0D%0AПропозиція: ${message}`;
      const mailtoLink = `mailto:p.hrytsenko@pharmasco.com?subject=${subject}&body=${body}`;

      window.location.href = mailtoLink;
    }
  </script>
