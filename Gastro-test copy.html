                showCatalogView();

                const product = productsData.find(p => p.id === hash);
                if (product) {

                } else {
                    showCatalogView();
                }
            }
            lucide.createIcons();

            currentProductId = null;
            document.getElementById('nav-home-btn').classList.add('hidden');

            const main = document.getElementById('main-content');
            
            let html = `
                <div class="bg-gradient-to-r from-green-700 to-yellow-800 text-white rounded-2xl p-6 sm:p-8 mb-8 shadow-xl">
                    <div class="max-w-3xl">
                        <span class="inline-block bg-green-500/30 text-green-100 text-xs font-semibold px-3 py-1 rounded-full mb-3 uppercase tracking-wider border border-green-400/30">Тести гастро напрямок</span>
                        <h2 class="text-2xl sm:text-3xl font-extrabold mb-3">Перевір свої знання</h2>
                        <p class="text-green-100 text-sm sm:text-base leading-relaxed mb-6">
                            Оберіть необхідний препарат нижче для проходження інтерактивного тесту
                        </p>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            `;

            productsData.forEach(p => {
                const fullUrl = `${window.location.origin}${window.location.pathname}#${p.id}`;
                html += `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between overflow-hidden group">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-3">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-100 text-slate-700">${p.category}</span>
                                <span class="text-xs font-medium text-green-600 bg-green-50 px-2 py-0.5 rounded border border-green-100">5 питань</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-900 group-hover:text-green-600 transition-colors">${p.name}</h3>
                            <p class="text-xs font-medium text-slate-500 mb-3">${p.subtitle}</p>
                            <div class="inline-block bg-slate-50 text-slate-600 text-xs px-2.5 py-1 rounded border border-slate-200 font-mono mb-4">
                                ${p.badge}
                            </div>
                        </div>

                        <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex items-center justify-between gap-2">
                          
                            <button onclick="navigateTo('quiz', '${p.id}')" class="flex-grow flex items-center justify-center space-x-1 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 px-4 py-1.5 rounded-lg transition-colors shadow-sm">
                                <span>Пройти тест</span>
                                <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            main.innerHTML = html;
        }

        function showQuizView(productId) {
            currentView = 'quiz';
            currentProductId = productId;
            document.getElementById('nav-home-btn').classList.remove('hidden');

            const product = productsData.find(p => p.id === productId);
            if (!product) return showCatalogView();

            // Reset quiz state for this product
            quizState = {
                currentQuestionIndex: 0,
                answers: new Array(product.questions.length).fill(null),
                isSubmitted: false
            };

            renderQuizContent(product);
        }

        function renderQuizContent(product) {
            const main = document.getElementById('main-content');
            const totalQ = product.questions.length;
            const currentQIndex = quizState.currentQuestionIndex;
            const currentQ = product.questions[currentQIndex];

            if (quizState.isSubmitted) {
                renderQuizResults(product);
                return;
            }

            const fullUrl = `${window.location.origin}${window.location.pathname}#${product.id}`;

            let html = `
                <div class="bg-white rounded-xl border border-slate-200 p-5 mb-6 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded bg-green-100 text-green-800">${product.category}</span>
                                <span class="text-xs text-slate-400">• Тест перевірки знань</span>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-900 mt-1">${product.name}</h2>
                        </div>
                    </div>

                    <!-- Progress bar -->
                    <div class="mt-4 flex items-center justify-between text-xs font-medium text-slate-500 mb-2">
                        <span>Запитання ${currentQIndex + 1} з ${totalQ}</span>
                        <span>${Math.round(((currentQIndex + 1) / totalQ) * 100)}% Завершено</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div class="bg-green-600 h-full transition-all duration-300" style="width: ${((currentQIndex + 1) / totalQ) * 100}%"></div>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 p-6 sm:p-8 shadow-sm">
                    <h3 class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-snug">
                        ${currentQIndex + 1}. ${currentQ.q}
                    </h3>

                    <div class="space-y-3 mb-8">
            `;

            currentQ.options.forEach((option, idx) => {
                const isSelected = quizState.answers[currentQIndex] === idx;
                html += `
                    <label onclick="selectAnswer(${idx})" class="flex items-start p-4 rounded-xl border cursor-pointer transition-all ${
                        isSelected 
                            ? 'border-green-600 bg-green-50/50 ring-2 ring-green-500/20' 
                            : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'
                    }">
                        <div class="flex items-center h-5 mt-0.5">
                            <input type="radio" name="option" ${isSelected ? 'checked' : ''} class="h-4 w-4 text-green-600 border-slate-300 focus:ring-green-500">
                        </div>
                        <span class="ml-3 text-sm sm:text-base text-slate-700 font-medium">${option}</span>
                    </label>
                `;
            });

            html += `
                    </div>

                    <!-- Navigation controls inside quiz -->
                    <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                        <button onclick="prevQuestion()" ${currentQIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed flex items-center space-x-1 text-sm font-medium text-slate-400 px-4 py-2 rounded-lg bg-slate-100"' : 'class="flex items-center space-x-1 text-sm font-medium text-slate-700 hover:bg-slate-100 px-4 py-2 rounded-lg transition-colors bg-slate-50 border border-slate-200"'}>
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            <span>Назад</span>
                        </button>

                        ${currentQIndex === totalQ - 1 ? `
                            <button onclick="submitQuiz()" class="flex items-center space-x-2 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 px-6 py-2.5 rounded-lg transition-colors shadow-sm">
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                                <span>Завершити тест</span>
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="flex items-center space-x-1 text-sm font-semibold text-white bg-green-600 hover:bg-green-700 px-5 py-2.5 rounded-lg transition-colors shadow-sm">
                                <span>Далі</span>
                                <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>
                        `}
                    </div>
                </div>
            `;

            main.innerHTML = html;
            lucide.createIcons();
        }

        function selectAnswer(index) {
            quizState.answers[quizState.currentQuestionIndex] = index;
            const product = productsData.find(p => p.id === currentProductId);
            renderQuizContent(product);
        }

        function nextQuestion() {
            const product = productsData.find(p => p.id === currentProductId);
            if (quizState.currentQuestionIndex < product.questions.length - 1) {
                quizState.currentQuestionIndex++;
                renderQuizContent(product);
            }
        }

        function prevQuestion() {
            const product = productsData.find(p => p.id === currentProductId);
            if (quizState.currentQuestionIndex > 0) {
                quizState.currentQuestionIndex--;
                renderQuizContent(product);
            }
        }

        function submitQuiz() {
            quizState.isSubmitted = true;
            const product = productsData.find(p => p.id === currentProductId);
            renderQuizResults(product);
        }

        function renderQuizResults(product) {
            const main = document.getElementById('main-content');
            let score = 0;
            product.questions.forEach((q, idx) => {
                if (quizState.answers[idx] === q.correct) {
                    score++;
                }
            });

            const percent = Math.round((score / product.questions.length) * 100);

            let html = `
                <div class="bg-white rounded-xl border border-slate-200 p-6 sm:p-8 mb-8 text-center shadow-sm">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 ${percent >= 80 ? 'bg-emerald-100 text-emerald-600' : percent >= 60 ? 'bg-amber-100 text-amber-600' : 'bg-rose-100 text-rose-600'}">
                        <i data-lucide="${percent >= 80 ? 'award' : percent >= 60 ? 'check' : 'alert-circle'}" class="w-8 h-8"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-1">Результат тесту: ${product.name}</h2>
                    <p class="text-sm text-slate-500 mb-4">Ви відповіли правильно на ${score} з ${product.questions.length} питань (${percent}%)</p>

                    <div class="flex justify-center items-center space-x-3">
                        <button onclick="showQuizView('${product.id}')" class="flex items-center space-x-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition-colors">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                            <span>Пройти знову</span>
                        </button>
                        <button onclick="navigateTo('home')" class="flex items-center space-x-2 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg transition-colors">
                            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
                            <span>До всіх тестів</span>
                        </button>
                    </div>
                </div>

                <h3 class="text-lg font-bold text-slate-900 mb-4">Детальний аналіз відповідей:</h3>
                <div class="space-y-4">
            `;

            product.questions.forEach((q, idx) => {
                const userAnswer = quizState.answers[idx];
                const isCorrect = userAnswer === q.correct;

                html += `
                    <div class="bg-white rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/20' : 'border-rose-200 bg-rose-50/20'} p-5">
                        <div class="flex items-start justify-between mb-3">
                            <h4 class="text-sm font-bold text-slate-900">${idx + 1}. ${q.q}</h4>
                            <span class="text-xs font-bold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                                ${isCorrect ? 'Правильно' : 'Помилка'}
                            </span>
                        </div>

                        <div class="space-y-1.5 mb-3 text-xs sm:text-sm">
                            <p class="${userAnswer === q.correct ? 'text-emerald-700 font-semibold' : 'text-rose-700'}">
                                <span class="text-slate-500 font-normal">Ваша відповідь:</span> ${userAnswer !== null ? q.options[userAnswer] : 'Не обрано'}
                            </p>
                            ${!isCorrect ? `
                                <p class="text-emerald-700 font-semibold">
                                    <span class="text-slate-500 font-normal">Правильна відповідь:</span> ${q.options[q.correct]}
                                </p>
                            ` : ''}
                        </div>

                        <div class="bg-white p-3 rounded-lg border border-slate-200 text-xs text-slate-600 flex items-start space-x-2">
                            <i data-lucide="info" class="w-4 h-4 text-green-500 flex-shrink-0 mt-0.5"></i>
                            <div>
                                <span class="font-semibold text-slate-700">Фармацевтичне обґрунтування:</span> ${q.explanation}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            main.innerHTML = html;
            lucide.createIcons();
        }

        function copyProductLink(productId) {
            const url = `${window.location.origin}${window.location.pathname}#${productId}`;
            navigator.clipboard.writeText(url).then(() => {
                showToast("Пряме посилання скопійовано в буфер обміну!");
            }).catch(err => {
                prompt("Скопіюйте посилання вручну:", url);
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center space-x-2 border border-slate-700 animate-bounce";
            toast.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i><span>${message}</span>`;
            document.body.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
